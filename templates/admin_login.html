<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Campus Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border-radius: 16px; border: none; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 65px; height: 65px; font-size: 26px;">
                            <i class="fa-solid fa-user-shield"></i>
                        </div>
                        <h4 class="fw-bold text-dark">Admin Portal</h4>
                        <p class="text-muted small">Campus Security & Management Control</p>
                    </div>

                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        <div class="alert alert-danger py-2 small text-center" role="alert">{{ messages[0] }}</div>
                      {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('admin_login') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Admin Username / Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user-gear text-muted"></i></span>
                                <input type="text" name="username" class="form-control border-start-0 shadow-none bg-light" placeholder="admin" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Secure Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control border-start-0 shadow-none bg-light" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 rounded-pill fw-semibold shadow-sm mb-3">Authenticate Admin</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('login') }}" class="text-muted small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Student Portal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
