<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Smart Campus Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4 border-secondary" style="width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Admin Portal</h3>
            <p class="text-muted small">Secure login for campus administration</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Admin Email</label>
                <input type="email" name="email" class="form-control" placeholder="admin@campus.edu" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2">Admin Sign In</button>
        </form>

        <div class="text-center mt-4">
            <small><a href="{{ url_for('login') }}" class="text-decoration-none text-muted">← Back to Student Portal</a></small>
        </div>
    </div>
</body>
</html>
