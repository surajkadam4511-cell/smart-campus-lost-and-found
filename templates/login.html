<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4" style="width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Smart Campus</h3>
            <p class="text-muted small">
                {% if is_admin_portal %}
                    Admin Portal Login
                {% else %}
                    Student Portal Login
                {% endif %}
            </p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form action="{{ url_for('admin_login') if is_admin_portal else url_for('login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <!-- Changed type to text so the custom Python error message shows up properly -->
                <input type="text" class="form-control" name="email" required placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-dark w-100 mb-3">Login</button>
        </form>

        <div class="text-center small">
            {% if is_admin_portal %}
                <a href="{{ url_for('login') }}" class="text-decoration-none">Switch to Student Login</a>
            {% else %}
                <p class="mb-1">Don't have an account? <a href="{{ url_for('signup') }}" class="text-decoration-none">Sign Up</a></p>
                <a href="{{ url_for('admin_login') }}" class="text-decoration-none text-muted">Admin Login</a>
            {% endif %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
