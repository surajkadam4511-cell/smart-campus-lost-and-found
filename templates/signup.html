<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4" style="width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Smart Campus</h3>
            <p class="text-muted small">Create a Student Account</p>
        </div>

        <!-- Server-side error message -->
        {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <!-- Client-side JavaScript error banner -->
        <div id="clientError" class="alert alert-danger py-2 small d-none" role="alert"></div>

        <form id="signupForm" action="{{ url_for('signup') }}" method="POST" onsubmit="return validateForm()">
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="text" class="form-control" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="text" class="form-control" id="phone" name="phone" required maxlength="10" placeholder="Enter 10-digit mobile number">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="At least 6 characters">
            </div>
            <button type="submit" class="btn btn-dark w-100 mb-3">Sign Up</button>
        </form>

        <div class="text-center small">
            <p class="mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none">Login</a></p>
        </div>
    </div>

    <!-- JavaScript Validation Script -->
    <script>
        function validateForm() {
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('clientError');

            // Email check
            const emailRegex = /^[\w\.-]+@[\w\.-]+\.\w+$/;
            if (!emailRegex.test(email)) {
                errorDiv.textContent = "Please enter a valid email address.";
                errorDiv.classList.remove('d-none');
                return false;
            }

            // Phone check (must be 10 digits and numbers only)
            const phoneRegex = /^\d{10}$/;
            if (!phoneRegex.test(phone)) {
                errorDiv.textContent = "Mobile number must be exactly 10 digits.";
                errorDiv.classList.remove('d-none');
                return false;
            }

            // Password check (minimum 6 characters)
            if (password.length < 6) {
                errorDiv.textContent = "Password must be at least 6 characters long.";
                errorDiv.classList.remove('d-none');
                return false;
            }

            errorDiv.classList.add('d-none');
            return true;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
